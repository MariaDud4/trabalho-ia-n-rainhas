<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA: O Problema das N-Rainhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Problema das N-Rainhas</h1>
        <p>Busca Heurística com Algoritmo Hill Climbing</p>
    </header>

    <div class="container">
        <div class="panel">
            <div class="control-group">
                <label for="nValue">Tamanho do Tabuleiro (N):</label>
                <input type="number" id="nValue" value="8" min="4" max="16">
            </div>

            <div class="control-group">
                <label for="speedValue">Velocidade do Passo: <span id="txtSpeed">500</span>ms</label>
                <input type="range" id="speedValue" min="100" max="2000" step="100" value="500">
            </div>
            
            <button id="btnGenerate">Gerar Novo Tabuleiro</button>
            <button id="btnSolve">Resolver com IA</button>
            <button id="btnPause" disabled>Pausar</button> <div class="status-box">
                <div class="status-item">Conflitos Atuais: <span id="txtConflicts">0</span></div>
                <div class="status-item">Iterações: <span id="txtIterations">0</span></div>
                <div class="status-item">Estado: <span id="txtStatus">Aguardando</span></div>
            </div>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="decision-panel">
            <label>Decisões da IA (Passo a Passo):</label>
            <div id="decisionLog" class="decision-log">
                <div class="log-entry">Aguardando início...</div>
            </div>
        </div>
    </div>

    <script src="js/algorithm.js"></script>
    <script src="js/board.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
